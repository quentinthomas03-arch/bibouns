# =============================================================================
# À chaque commit sur main :
#   1. tests (logique + sécurité de la base)
#   2. mise à jour de la base Supabase (migrations + réglages d'auth)
#   3. build de l'appli avec les clés publiques Supabase
#   4. publication sur GitHub Pages
# Secrets nécessaires (Settings → Secrets and variables → Actions) :
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD
# Sans ces secrets, l'appli est quand même publiée (écran "se prépare").
# =============================================================================
name: Tester et déployer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  test:
    name: Tests appli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  test-db:
    name: Tests sécurité base
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-db.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  database:
    name: Mise à jour Supabase
    needs: [test, test-db]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secrets présents ?
        id: check
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secrets Supabase absents : étape ignorée (voir README, étape 2)."
          fi
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ok == 'true'
        with: { version: 3.1.0 } # version figée : pas de surprise lors des mises à jour de la CLI
      - name: Migrations
        if: steps.check.outputs.ok == 'true'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --yes
      - name: Fonction des notifications (push)
        if: steps.check.outputs.ok == 'true'
        run: |
          supabase functions deploy push --use-api --no-verify-jwt
          # Crée les clés VAPID si besoin (idempotent) et enregistre l'URL pour le cron
          for i in 1 2 3 4 5; do
            if curl -fsS -X POST "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/push" \
                 -H "Content-Type: application/json" -d '{"action":"init"}' > /dev/null; then
              echo "Notifications prêtes"; exit 0
            fi
            sleep $((i * 5))
          done
          echo "::warning::La fonction push ne répond pas encore ; elle sera initialisée au prochain déploiement."
      - name: Réglages d'authentification (connexion anonyme)
        if: steps.check.outputs.ok == 'true'
        run: |
          SITE="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          curl -fsS -X PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"external_anonymous_users_enabled\": true, \"site_url\": \"$SITE\"}" > /dev/null
          echo "Connexion anonyme activée, site : $SITE"

  build:
    name: Build
    needs: [database]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Récupère les clés publiques Supabase
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            KEYS=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys")
            KEY=$(echo "$KEYS" | jq -r '([.[] | select(.name=="anon")][0].api_key) // ([.[] | select(.type=="publishable")][0].api_key) // empty')
            echo "VITE_SUPABASE_URL=https://$SUPABASE_PROJECT_REF.supabase.co" >> "$GITHUB_ENV"
            echo "VITE_SUPABASE_ANON_KEY=$KEY" >> "$GITHUB_ENV"
          fi
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    name: Publication GitHub Pages
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
