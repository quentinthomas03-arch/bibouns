# Supabase (offre gratuite) met en pause un projet inactif 7 jours.
# Ce petit appel quotidien le garde éveillé. Il ne lit aucune donnée (RLS).
name: Garder Supabase éveillé

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          [ -z "$SUPABASE_PROJECT_REF" ] && { echo "Pas encore configuré"; exit 0; }
          KEY=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys" | jq -r '[.[] | select(.name=="anon")][0].api_key')
          curl -fsS "https://$SUPABASE_PROJECT_REF.supabase.co/rest/v1/households?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" && echo " ✓ éveillé"
